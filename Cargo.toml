[workspace]
members = ["libscanmem", "scanmem", "gameconqueror"]
resolver = "3"

[workspace.package]
edition = "2024"
homepage = "https://github.com/Gigas002/scanmem-rs"
description = "Rust port of scanmem: process memory scanner/editor and GUI"
keywords = ["memory", "scanner", "ptrace", "reverse-engineering"]
repository = "https://github.com/Gigas002/scanmem-rs"
version = "0.1.0"

[workspace.dependencies]
bitflags = "2"
libc = "0.2"
num-traits = "0.2"
rustix = "1"
signal-hook = "0.4"
thiserror = "2"
tracing = "0.1"
